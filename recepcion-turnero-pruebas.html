<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recepción guiada | Turnero pruebas</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script>tailwind.config={theme:{extend:{colors:{verde:'#00CE7C',oscuro:'#006068',turquesa:'#028B98',tomate:'#E47E3D'}}}}</script><style>body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 0 0,#00ce7c1c,transparent 30%),#f4f8f7}.card{background:#fff;border:1px solid #0060681f;border-radius:1.5rem;box-shadow:0 15px 35px #00606812}.step{display:none}.step.active{display:block}.stepdot{width:2.25rem;height:2.25rem;border-radius:999px;display:grid;place-items:center;font-weight:900;background:#e5e7eb;color:#6b7280}.stepdot.active{background:#00CE7C;color:#006068;box-shadow:0 0 0 6px #00ce7c20}.choice{border:2px solid #e5e7eb;border-radius:1.1rem;padding:1rem;text-align:left;font-weight:850;transition:.15s}.choice:hover,.choice.active{border-color:#00CE7C;background:#ecfdf5;transform:translateY(-1px)}.field{width:100%;padding:.8rem;border:1px solid #d1d5db;border-radius:.9rem}.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.9rem;padding:.75rem 1rem;font-weight:900}</style></head><body><div id="loading" class="fixed inset-0 z-50 bg-white flex items-center justify-center"><i class="fa-solid fa-spinner fa-spin text-5xl text-verde"></i></div><main id="app" class="hidden max-w-5xl mx-auto p-4 md:p-7"><header class="card bg-gradient-to-r from-oscuro to-turquesa text-white p-5 flex items-center justify-between gap-4"><div class="flex items-center gap-4"><img src="logo-icono-cordillera.jpg" class="w-16 h-16 object-contain bg-white p-2 rounded-2xl border-2 border-verde"><div><p class="text-xs tracking-[.25em] uppercase text-white/70">Recepción</p><h1 class="text-3xl font-black">Emisión guiada de turnos</h1><p class="text-sm text-white/70">Tipo de usuario → identificación → trámite → comprobante.</p></div></div><a href="turnero-pruebas.html" class="btn bg-white/15 text-white"><i class="fa-solid fa-arrow-left"></i>Volver</a></header><div class="card mt-5 p-4"><div class="grid grid-cols-4 gap-2 text-center text-xs font-bold text-gray-500"><div><span id="dot1" class="stepdot active mx-auto">1</span><p class="mt-2">Usuario</p></div><div><span id="dot2" class="stepdot mx-auto">2</span><p class="mt-2">Identificación</p></div><div><span id="dot3" class="stepdot mx-auto">3</span><p class="mt-2">Trámite</p></div><div><span id="dot4" class="stepdot mx-auto">4</span><p class="mt-2">Confirmar</p></div></div></div><section class="card mt-5 p-5 md:p-7 min-h-[430px]"><div id="s1" class="step active"><p class="text-xs font-black uppercase tracking-widest text-turquesa">Paso 1</p><h2 class="text-2xl font-black text-oscuro mt-1">¿Quién solicita atención?</h2><div class="grid md:grid-cols-2 gap-3 mt-6"><button class="choice active" data-type="Estudiante"><i class="fa-solid fa-graduation-cap text-verde text-xl mr-2"></i>Estudiante Cordillera<p class="text-xs font-normal text-gray-500 mt-1">Consulta automática del Directorio.</p></button><button class="choice" data-type="Externo"><i class="fa-solid fa-user-plus text-tomate text-xl mr-2"></i>Persona externa / estudiante nuevo<p class="text-xs font-normal text-gray-500 mt-1">Registro de nombres y contacto.</p></button></div></div><div id="s2" class="step"><p class="text-xs font-black uppercase tracking-widest text-turquesa">Paso 2</p><h2 class="text-2xl font-black text-oscuro mt-1">Identificación</h2><div class="mt-5"><label class="font-bold">Cédula / identificación</label><div class="flex gap-2 mt-2"><input id="cedula" class="field" placeholder="Ingrese el número"><button id="search" class="btn bg-oscuro text-white"><i class="fa-solid fa-search"></i>Buscar</button></div><div id="student" class="hidden mt-4 rounded-xl border border-emerald-200 bg-emerald-50 p-4"></div></div><div id="external" class="hidden grid md:grid-cols-2 gap-3 mt-4"><input id="names" class="field" placeholder="Nombres"><input id="last" class="field" placeholder="Apellidos"><input id="inst" class="field" placeholder="Correo institucional (opcional)"><input id="personal" class="field" placeholder="Correo personal (opcional)"><input id="wa" class="field md:col-span-2" placeholder="WhatsApp (opcional)"></div></div><div id="s3" class="step"><p class="text-xs font-black uppercase tracking-widest text-turquesa">Paso 3</p><h2 class="text-2xl font-black text-oscuro mt-1">Seleccione el trámite</h2><div id="services" class="grid md:grid-cols-2 gap-3 mt-5"></div><div class="mt-5"><label class="font-bold">Detalle del requerimiento <span class="text-gray-400 font-normal">(opcional)</span></label><textarea id="detail" class="field mt-2" rows="3"></textarea></div><div class="mt-4"><label class="font-bold">Prioridad</label><select id="priority" class="field mt-2"><option>Normal</option><option>Preferente</option></select></div></div><div id="s4" class="step"><p class="text-xs font-black uppercase tracking-widest text-turquesa">Paso 4</p><h2 class="text-2xl font-black text-oscuro mt-1">Confirmar emisión</h2><div id="summary" class="mt-5 rounded-2xl bg-gradient-to-br from-emerald-50 to-cyan-50 border border-emerald-200 p-5"></div><label class="flex items-center gap-2 mt-4"><input id="print" type="checkbox" checked> Imprimir comprobante al generar</label></div><div class="flex justify-between gap-2 border-t mt-7 pt-5"><button id="back" class="btn bg-gray-100 text-gray-700"><i class="fa-solid fa-arrow-left"></i>Anterior</button><button id="next" class="btn bg-verde text-oscuro">Siguiente<i class="fa-solid fa-arrow-right"></i></button><button id="emit" class="btn bg-oscuro text-white hidden"><i class="fa-solid fa-print"></i>Generar turno</button></div></section></main><script>
const SUPABASE_URL='https://nuzhzroufdpbmdomwfaf.supabase.co',SUPABASE_ANON_KEY='sb_publishable_9GD88bBJ-wNPWFVfpH6WyA_WRjzNCYA',sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let step=1,type='Estudiante',student=null,services=[],serviceId='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),toast=(m,ok=true)=>Swal.fire({toast:true,position:'top-end',icon:ok?'success':'error',title:m,showConfirmButton:false,timer:3000});
async function auth(){const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Sin sesión');const{data:p}=await sb.from('agentes').select('*').eq('auth_user_id',session.user.id).maybeSingle();if(!p||p.rol!=='admin'||p.activo===false)throw new Error('Acceso exclusivo para administrador');$('loading').classList.add('hidden');$('app').classList.remove('hidden')}
function show(n){step=n;document.querySelectorAll('.step').forEach(x=>x.classList.remove('active'));$('s'+n).classList.add('active');for(let i=1;i<=4;i++)$('dot'+i).classList.toggle('active',i<=n);$('back').classList.toggle('hidden',n===1);$('next').classList.toggle('hidden',n===4);$('emit').classList.toggle('hidden',n!==4);if(n===4)summary()}document.querySelectorAll('.choice[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('.choice[data-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('external').classList.toggle('hidden',type!=='Externo');$('student').classList.add('hidden');student=null});
async function loadServices(){const{data,error}=await sb.from('turnero_pruebas_servicios').select('*').eq('activo',true).order('nombre');if(error)throw error;services=data||[];$('services').innerHTML=services.map(s=>`<button class="choice srv" data-id="${s.id}"><b class="text-oscuro">${esc(s.nombre)}</b><p class="text-xs font-normal text-gray-500 mt-1">${esc(s.prefijo)} · atención estimada ${s.tiempo_estimado_min} min</p></button>`).join('');document.querySelectorAll('.srv').forEach(b=>b.onclick=()=>{serviceId=b.dataset.id;document.querySelectorAll('.srv').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}
$('search').onclick=async()=>{if(type==='Externo')return;const cedula=$('cedula').value.trim();if(!cedula)return toast('Ingresa la cédula.',false);const{data,error}=await sb.rpc('turnero_pruebas_buscar_estudiante',{p_cedula:cedula});if(error||!data?.length){student=null;$('student').classList.add('hidden');return toast(error?.message||'No encontrado',false)}student=data[0];$('student').classList.remove('hidden');$('student').innerHTML=`<b class="text-oscuro">${esc(student.nombres)}</b><p class="text-sm">${esc(student.carrera||'')} ${esc(student.nivel||'')}</p><p class="text-xs mt-2">${esc(student.correo||'')} · ${esc(student.whatsapp||student.celular||'')}</p>`;toast('Estudiante encontrado')};
$('next').onclick=()=>{if(step===1)return show(2);if(step===2){if(!$('cedula').value.trim())return toast('Ingresa la identificación.',false);if(type==='Estudiante'&&!student)return toast('Busca y valida al estudiante.',false);if(type==='Externo'&&(!$('names').value.trim()||!$('last').value.trim()))return toast('Completa nombres y apellidos.',false);return show(3)}if(step===3){if(!serviceId)return toast('Selecciona un trámite.',false);show(4)}};$('back').onclick=()=>show(Math.max(1,step-1));function summary(){const srv=services.find(x=>String(x.id)===String(serviceId)),name=type==='Estudiante'?(student?.nombres||''):($('names').value+' '+$('last').value).trim();$('summary').innerHTML=`<div class="grid md:grid-cols-2 gap-4"><div><span class="text-xs text-gray-500">Usuario</span><b class="block text-lg text-oscuro">${esc(name)}</b><p class="text-sm">${esc($('cedula').value)} · ${esc(type)}</p></div><div><span class="text-xs text-gray-500">Trámite</span><b class="block text-lg text-oscuro">${esc(srv?.nombre||'')}</b><p class="text-sm">Prioridad: ${esc($('priority').value)}</p></div></div>`}
async function estimate(sid){const{data}=await sb.rpc('turnero_pruebas_resumen_operativo');const s=(data?.servicios||[]).find(x=>String(x.id)===String(sid)),free=(data?.ventanillas||[]).filter(w=>w.estado_operativo==='Disponible'&&w.estado_horario?.operativa).length||1;return{people:Math.max(0,Number(s?.en_espera||0)-1),minutes:Math.max(0,Math.ceil(Math.max(0,Number(s?.en_espera||0)-1)*Number(s?.tiempo_estimado_min||10)/free))}}
$('emit').onclick=async()=>{const args={p_servicio_id:serviceId,p_cedula:$('cedula').value,p_nombre_usuario:type==='Externo'?$('names').value:null,p_apellidos_usuario:type==='Externo'?$('last').value:null,p_tipo_usuario:type,p_prioridad:$('priority').value,p_correo_institucional_usuario:type==='Externo'?$('inst').value:null,p_correo_personal_usuario:type==='Externo'?$('personal').value:null,p_whatsapp_usuario:type==='Externo'?$('wa').value:null,p_detalle_requerimiento:$('detail').value};const{data,error}=await sb.rpc('turnero_pruebas_emitir_turno',args);if(error)return toast(error.message,false);const e=await estimate(serviceId),srv=services.find(x=>String(x.id)===String(serviceId)),code=data?.codigo||'Turno';if($('print').checked){const w=window.open('','_blank','width=360,height=650');if(w){w.document.write(`<html><head><style>body{font-family:Arial;text-align:center;width:72mm;margin:0 auto;padding:5mm}h1{font-size:30px;color:#006068}</style></head><body><b>TECNOLOGICO UNIVERSITARIO CORDILLERA</b><h1>${esc(code)}</h1><p>${esc(srv?.nombre||'')}</p><p>Personas antes: ${e.people}</p><p>Espera estimada: ${e.minutes} min</p><hr><small>COMPROBANTE DE PRUEBA - NO VALIDO PARA ATENCION</small><script>print();<\/script></body></html>`);w.document.close()}}const r=await Swal.fire({title:'Turno generado',icon:'success',html:`<h2 style="font-size:30px;color:#006068">${esc(code)}</h2><p>${esc(srv?.nombre||'')}</p><p><b>Personas antes:</b> ${e.people}</p><p><b>Espera estimada:</b> ${e.minutes} min</p>`,showCancelButton:true,confirmButtonText:'Nuevo turno',cancelButtonText:'Ir a panel',confirmButtonColor:'#006068'});if(r.dismiss===Swal.DismissReason.cancel)location.href='panel-atencion-turnero-pruebas.html';else location.reload()};
(async()=>{try{await auth();await loadServices();show(1)}catch(e){$('loading').innerHTML=`<p class="font-bold text-red-700">${esc(e.message)}</p>`}})();
</script></body></html>
