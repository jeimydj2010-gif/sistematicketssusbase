<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supervisión en tiempo real | Turnero pruebas</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script>tailwind.config={theme:{extend:{colors:{verde:'#00CE7C',oscuro:'#006068',turquesa:'#028B98',tomate:'#E47E3D'}}}}</script><style>body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 5% 5%,#00ce7c16,transparent 25%),#f2f7f6}.card{background:white;border:1px solid #00606820;border-radius:1.25rem;box-shadow:0 12px 30px #00606810}.kpi{position:relative;overflow:hidden}.kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,#00CE7C)}.win{border-left:6px solid var(--c,#00CE7C)}.hot{background:#fff7ed;border-color:#fdba74}.critical{background:#fef2f2;border-color:#fca5a5}.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.72rem 1rem;border-radius:.9rem;font-weight:900}</style></head><body><div id="loading" class="fixed inset-0 z-50 bg-white flex items-center justify-center"><i class="fa-solid fa-spinner fa-spin text-5xl text-verde"></i></div><main id="app" class="hidden max-w-[1600px] mx-auto p-4 md:p-7"><header class="card bg-gradient-to-r from-oscuro via-turquesa to-oscuro text-white p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4"><div class="flex items-center gap-4"><img src="logo-icono-cordillera.jpg" class="w-16 h-16 bg-white p-2 rounded-2xl border-2 border-verde"><div><p class="text-xs uppercase tracking-[.3em] text-white/70">Turnero de pruebas</p><h1 class="text-3xl font-black">Supervisión en tiempo real</h1><p class="text-white/70 text-sm">Cola, espera, ventanillas y carga operativa.</p></div></div><div class="flex flex-wrap gap-2"><a href="panel-atencion-turnero-pruebas.html" class="btn bg-verde text-oscuro"><i class="fa-solid fa-headset"></i>Panel</a><a href="recepcion-turnero-pruebas.html" class="btn bg-white/15 text-white"><i class="fa-solid fa-ticket"></i>Recepción</a><a href="turnero-pruebas.html" class="btn bg-white/15 text-white"><i class="fa-solid fa-arrow-left"></i>Volver</a></div></header><section id="kpis" class="grid sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-7 gap-3 mt-5"></section><section class="grid xl:grid-cols-[1.1fr_.9fr] gap-5 mt-5"><div class="card p-5"><div class="flex justify-between"><div><h2 class="font-black text-oscuro text-xl">Ventanillas</h2><p class="text-sm text-gray-500">Estado, modalidad y turno actual.</p></div><span id="clock" class="font-bold text-turquesa"></span></div><div id="windows" class="grid md:grid-cols-2 gap-3 mt-4"></div></div><div class="space-y-5"><div class="card p-5"><h2 class="font-black text-oscuro text-xl">Demanda por servicio</h2><div id="services" class="space-y-2 mt-4"></div></div><div class="card p-5"><h2 class="font-black text-oscuro text-xl">Alertas de espera</h2><div id="alerts" class="space-y-2 mt-4"></div></div></div></section></main><script>
const SUPABASE_URL=window.TURNERO_SUPABASE?.url||'',SUPABASE_ANON_KEY=window.TURNERO_SUPABASE?.anonKey||'',sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>{v=Math.max(0,Number(v)||0);const m=Math.floor(v/60);return m<60?`${m}m`:`${Math.floor(m/60)}h ${m%60}m`},short=c=>{const m=String(c||'').match(/(?:PRUEBA-)?([A-Z0-9]+)-(?:\d{8}-)?(\d+)$/i);return m?`${m[1]}-${String(m[2]).padStart(3,'0')}`:c||'-'};let D={turnos:[],servicios:[],ventanillas:[],config:{}};
async function auth(){const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Sin sesión');const{data:p}=await sb.from('agentes').select('*').eq('auth_user_id',session.user.id).maybeSingle();if(!p||p.rol!=='admin'||p.activo===false)throw new Error('Acceso exclusivo para administrador');$('loading').classList.add('hidden');$('app').classList.remove('hidden')}
async function load(){const{data,error}=await sb.rpc('turnero_pruebas_resumen_operativo');if(error)throw error;D=data||D;render()}function render(){const turns=D.turnos||[],waiting=turns.filter(x=>x.estado==='Pendiente'),calling=turns.filter(x=>x.estado==='Llamando'),att=turns.filter(x=>x.estado==='En atención'),resolved=turns.filter(x=>x.estado==='Resuelto'),noshow=turns.filter(x=>x.estado==='No presentado'),now=Date.now(),waits=waiting.map(x=>Math.max(0,(now-new Date(x.hora_emision||x.created_at).getTime())/1000)),avg=waits.length?waits.reduce((a,b)=>a+b,0)/waits.length:0,available=(D.ventanillas||[]).filter(w=>w.estado_operativo==='Disponible'&&w.estado_horario?.operativa).length;const k=[['En espera',waiting.length,'#E47E3D'],['Llamando',calling.length,'#028B98'],['En atención',att.length,'#6264A7'],['Resueltos',resolved.length,'#00CE7C'],['No presentados',noshow.length,'#666'],['Espera promedio',fmt(avg),'#006068'],['Ventanillas libres',available,'#00CE7C']];$('kpis').innerHTML=k.map(x=>`<div class="card kpi p-4" style="--c:${x[2]}"><p class="text-xs font-black uppercase text-gray-400">${x[0]}</p><b class="text-2xl text-oscuro">${x[1]}</b></div>`).join('');$('windows').innerHTML=(D.ventanillas||[]).map(w=>{const state=w.estado_operativo||'Disponible',color=state==='Disponible'?'#00CE7C':state==='Atendiendo'?'#028B98':state==='Fuera de servicio'?'#dc2626':'#E47E3D',t=w.turno_actual,h=w.estado_horario||{};return `<div class="win rounded-xl border p-4 bg-white" style="--c:${color}"><div class="flex justify-between gap-2"><div><b class="text-oscuro">Ventanilla ${esc(w.numero)}</b><p class="text-xs text-gray-500">${esc(w.secretaria_activa_nombre||w.secretaria_nombre||'Sin secretaria')}</p></div><span class="text-xs font-black" style="color:${color}">${esc(state)}</span></div><p class="text-xs mt-3 text-gray-500">${esc(h.mensaje||'Sin horario')}</p>${t?`<div class="mt-3 rounded-lg bg-gray-50 p-3"><b>${esc(short(t.codigo))}</b> · ${esc(t.estado)}<p class="text-xs">${esc(t.nombre||'')} · ${esc(t.servicio_nombre||t.categoria||'')}</p></div>`:'<p class="mt-3 text-xs text-gray-400">Sin turno activo</p>'}</div>`}).join('');const threshold=Number(D.config?.umbral_espera_min||20)*60;$('services').innerHTML=(D.servicios||[]).filter(s=>Number(s.en_espera)>0).sort((a,b)=>b.en_espera-a.en_espera).map(s=>`<div class="rounded-xl border p-3 ${Number(s.espera_max_seg)>=threshold?'hot':''}"><div class="flex justify-between"><b>${esc(s.nombre)}</b><span class="font-black text-oscuro">${s.en_espera}</span></div><div class="grid grid-cols-2 gap-2 text-xs text-gray-500 mt-2"><span>Promedio: ${fmt(s.espera_promedio_seg)}</span><span>Máxima: ${fmt(s.espera_max_seg)}</span></div></div>`).join('')||'<p class="text-gray-400">Sin cola.</p>';$('alerts').innerHTML=waiting.map(x=>({...x,w:Math.max(0,(now-new Date(x.hora_emision||x.created_at).getTime())/1000)})).filter(x=>x.w>=threshold).sort((a,b)=>b.w-a.w).map(x=>`<div class="rounded-xl border critical p-3"><b class="text-red-700">${esc(short(x.codigo))}</b><p class="text-xs">${esc(x.nombre||'')} · ${esc(x.servicio_nombre||x.categoria||'')}</p><b class="text-xs text-red-600">${fmt(x.w)} de espera</b></div>`).join('')||'<p class="text-gray-400">Sin alertas.</p>'}
setInterval(()=>$('clock').textContent=new Intl.DateTimeFormat('es-EC',{timeZone:'America/Guayaquil',timeStyle:'medium'}).format(new Date()),1000);setInterval(()=>load().catch(console.error),4000);(async()=>{try{await auth();await load();sb.channel('supervision-v13').on('postgres_changes',{event:'*',schema:'public',table:'secretaria_tickets',filter:'es_prueba=eq.true'},()=>load()).on('postgres_changes',{event:'*',schema:'public',table:'turnero_pruebas_ventanillas'},()=>load()).subscribe()}catch(e){$('loading').innerHTML=`<p class="font-bold text-red-700">${esc(e.message)}</p>`}})();
</script></body></html>
